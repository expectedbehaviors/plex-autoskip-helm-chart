# PlexAutoSkip baseline — override Plex address, externalSecrets, and skip config in your private values repo.
fullnameOverride: plex-auto-skip

externalSecrets:
  enabled: false
  secretName: plex-auto-skip
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  plexToken:
    key: plex
    property: token

skip:
  global:
    fullnameOverride: plex-auto-skip
  config:
    servername: Plex
    address: plex.example.svc.cluster.local
    ssl: false
    port: "32400"
    tags: "intro, commercial, advertisement, credits, outro, preview"
    types: "movie, episode"
    ignoreSkipFor: 1
    safeTags: "commercial, advertisement, preview"
    sameShowOnly: true
  logging:
    rootLevel: INFO
    consoleLevel: INFO
    fileLevel: INFO
    logFilename: activity.log
    fileMaxBytes: 100000
    fileBackupCount: 3
  customJson: {}
  defaultPodOptions:
    annotations: {}
  controllers:
    main:
      enabled: true
      type: deployment
      replicas: 1
      containers:
        main:
          image:
            repository: ghcr.io/mdhiggins/plexautoskip-docker
            tag: latest
            pullPolicy: IfNotPresent
          env:
            PUID: "911"
            PGID: "911"
            TZ: UTC
            PAS_PATH: /usr/local/pas
            PAS_UPDATE: "false"
            LSIO_NON_ROOT_USER: "true"
          probes:
            startup:
              enabled: false
            liveness:
              enabled: false
            readiness:
              enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
  ingress:
    main:
      enabled: false
  persistence:
    config:
      enabled: true
      type: secret
      name: plex-auto-skip
      globalMounts:
        - path: /config
          readOnly: false
