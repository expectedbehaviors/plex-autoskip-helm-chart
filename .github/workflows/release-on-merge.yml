# Auto-release on merge to main: validate chart, bump patch version, create tag and release.
# Triggers Helm publish (see .github/workflows/README.md).

name: Release on merge to main

on:
  push:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'README.md'
      - '.helmignore'
      - 'templates/**'
  pull_request:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'README.md'
      - '.helmignore'
      - 'templates/**'

concurrency: release-on-merge

jobs:
  validate:
    if: github.event_name == 'pull_request'
    uses: expectedbehaviors/github-actions/.github/workflows/helm-chart-validate.yml@main
    with:
      chart_path: .
      helm_repositories: |
        bjw-s=https://bjw-s-labs.github.io/helm-charts

  release:
    if: github.event_name == 'push'
    uses: expectedbehaviors/github-actions/.github/workflows/helm-chart-release-on-merge.yml@main
    secrets: inherit
    with:
      chart_path: .
      helm_repositories: |
        bjw-s=https://bjw-s-labs.github.io/helm-charts
      tag_prefix: v
