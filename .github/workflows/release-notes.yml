# Populate release notes from the merged PR, summarized as bullet points via OpenAI.

name: Release notes from PR

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release on merge to main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.1.0). Default: latest release.'
        required: false

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    uses: expectedbehaviors/github-actions/.github/workflows/helm-chart-release-notes.yml@main
    secrets: inherit
    with:
      release_tag: ${{ github.event.inputs.release_tag }}
      prompt_instruction: "Include concrete datapoints: chart version, plex-autoskip version, migration notes, breaking changes, and key values (Plex, credits)."
